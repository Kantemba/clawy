name: Create macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v0.2.0)"
        required: true
        type: string
      upload_to_release:
        description: "Attach DMGs to the GitHub Release"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v0.2.0)"
        required: true
        type: string
      upload_to_release:
        description: "Attach DMGs to the GitHub Release"
        required: false
        type: boolean
        default: true

jobs:
  dmg:
    name: DMG ${{ matrix.arch }}
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        # This creates two parallel jobs
        arch: [arm64, amd64]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      # 1. Install Go from go.mod
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/web/frontend/pnpm-lock.yaml

      # 3. Build the application bundle (VERSION feeds both the binaries'
      #    ldflags and the Info.plist bundle version)
      - name: Build app bundle
        run: make build ARCH=${{ matrix.arch }} && make build-macos-app ARCH=${{ matrix.arch }} VERSION="${{ inputs.tag }}"

      # 4. Apply ad-hoc signing
      - name: Ad-hoc Sign
        run: codesign --force --deep --sign - "build/Clawy.app"

      # 5. Install the DMG packaging tool
      - name: Install create-dmg
        run: brew install create-dmg

      # 6. Create a versioned DMG
      - name: Create DMG
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          create-dmg \
            --volname "Clawy Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Clawy.app" 200 190 \
            --hide-extension "Clawy.app" \
            --app-drop-link 600 185 \
            "dist/clawy_${VERSION}_macOS_${{ matrix.arch }}.dmg" \
            "build/Clawy.app"

      # 7. Upload the DMG as a workflow artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg

      # 8. Attach the DMG to the GitHub Release
      - name: Attach DMG to release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.dmg --repo "${{ github.repository }}" --clobber
