services:
  # ─────────────────────────────────────────────
  # Clawy Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm clawy-agent -m "Hello"
  # ─────────────────────────────────────────────
  clawy-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: clawy-agent-full
    profiles:
      - agent
    volumes:
      - ../config/config.json:/root/.clawy/config.json:ro
      - clawy-workspace:/root/.clawy/workspace
      - clawy-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["clawy", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Clawy Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  clawy-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: clawy-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ../config/config.json:/root/.clawy/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - clawy-workspace:/root/.clawy/workspace
      # NPM cache for faster MCP server installs
      - clawy-npm-cache:/root/.npm
    command: ["gateway"]

volumes:
  clawy-workspace:
  clawy-npm-cache: # Cache npm packages to speed up MCP server installations
