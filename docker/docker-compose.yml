services:
  # ─────────────────────────────────────────────
  # Clawy Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm clawy-agent -m "Hello"
  # ─────────────────────────────────────────────
  clawy-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/Kantemba/clawy:latest
    container_name: clawy-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.clawy
    entrypoint: ["clawy", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Clawy Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  clawy-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/Kantemba/clawy:latest
    container_name: clawy-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.clawy

  # ─────────────────────────────────────────────
  # Clawy Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  clawy-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: docker.io/Kantemba/clawy:launcher
    container_name: clawy-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - CLAWY_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- CLAWY_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.clawy
