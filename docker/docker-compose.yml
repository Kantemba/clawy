services:
  # ─────────────────────────────────────────────
  # Clawy Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm clawy-agent -m "Hello"
  # ─────────────────────────────────────────────
  clawy-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/Kantemba/clawy:latest
    container_name: clawy-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.clawy
    entrypoint: ["clawy", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Clawy Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  clawy-gateway:
    command: ["gateway"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18790/health"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/Kantemba/clawy:latest
    container_name: clawy-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.clawy

  # ─────────────────────────────────────────────
  # Clawy Web Console + Gateway (one executable)
  #   docker compose -f docker/docker-compose.yml --profile web up
  # ─────────────────────────────────────────────
  clawy-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/Kantemba/clawy:latest
    container_name: clawy-web
    restart: unless-stopped
    profiles:
      - web
    environment:
      - CLAWY_GATEWAY_HOST=0.0.0.0
      # Dashboard password is created in the browser on first run.
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.clawy
